# ⚙️ Research Taxonomy & Discovery Config
#
# Digital Sovereign Workplace research corpus.
# Topic, taxonomy, discovery queries, and keywords for the digital-sovereign-workplace field.

# ── Topic ────────────────────────────────────────────────────────────────────
topic:
  name: "Digital Sovereign Workplace"
  short: "digital-sovereign-workplace"
  description: '- GitHub: https://github.com/tobias-weiss-ai-xr/digital-sovereign-workplace-research'
  openalex_mailto: research@tobias-weiss-ai-xr.de

# ── Taxonomy ─────────────────────────────────────────────────────────────────
taxonomy:
  categories:
    - id: digital-workplace
      display: "Digital Workplace"
    - id: data-sovereignty
      display: "Data Sovereignty"
    - id: collaboration
      display: "Collaboration & Productivity"
    - id: identity-access
      display: "Identity & Access"
    - id: interoperability
      display: "Interoperability & Standards"
    - id: open-source
      display: "Open Source"
    - id: public-sector
      display: "Public Sector & Education"
    - id: sme-adoption
      display: "SME Adoption"
    - id: security-compliance
      display: "Security & Compliance"
    - id: adoption-change
      display: "Adoption & Change"
    - id: architecture
      display: "Architecture & Infrastructure"
    - id: evaluation
      display: "Evaluation & Case Studies"
    - id: survey
      display: "Surveys & Reviews"
    - id: method
      display: "Methods"
    - id: tooling
      display: "Tooling & Platforms"
  subcategories:
    - id: method
      display: "Method"
    - id: theory
      display: "Theory"
    - id: application
      display: "Application"
    - id: survey
      display: "Survey"
    - id: experiment
      display: "Experiment"
    - id: systems
      display: "Systems"
    - id: development
      display: "Development"
    - id: evaluation
      display: "Evaluation"
    - id: review
      display: "Review"
    - id: mechanism
      display: "Mechanism"

# ── Discovery: arXiv queries ─────────────────────────────────────────────────
arxiv_queries:
  - query: 'abs:"digital workplace" AND (sovereign OR sovereignty)'
    category: digital-workplace
    subcategory_hint: theory
  - query: 'abs:"data sovereignty" AND (workplace OR collaboration OR cloud)'
    category: data-sovereignty
    subcategory_hint: theory
  - query: 'abs:"sovereign cloud" AND (workplace OR office OR collaboration)'
    category: data-sovereignty
    subcategory_hint: application
  - query: 'abs:"collaborative systems" AND (sovereign OR open source)'
    category: collaboration
    subcategory_hint: systems
  - query: 'abs:"identity federation" AND (workplace OR enterprise)'
    category: identity-access
    subcategory_hint: method
  - query: 'abs:"single sign-on" AND (enterprise OR workplace)'
    category: identity-access
    subcategory_hint: application
  - query: 'abs:"interoperability" AND (digital workplace OR collaboration suite)'
    category: interoperability
    subcategory_hint: systems
  - query: 'abs:"open source" AND (office suite OR collaboration platform)'
    category: open-source
    subcategory_hint: application
  - query: 'abs:"digital workplace" AND (public sector OR government)'
    category: public-sector
    subcategory_hint: application
  - query: 'abs:"digital workplace adoption" AND (SME OR small medium)'
    category: sme-adoption
    subcategory_hint: application
  - query: 'abs:"GDPR" AND (workplace OR collaboration platform)'
    category: security-compliance
    subcategory_hint: application
  - query: 'abs:"change management" AND (digital workplace OR collaboration)'
    category: adoption-change
    subcategory_hint: method
  - query: 'abs:"digital workplace architecture" AND (sovereign OR self-hosted)'
    category: architecture
    subcategory_hint: systems
  - query: 'abs:"digital workplace" AND (evaluation OR case study)'
    category: evaluation
    subcategory_hint: evaluation
  - query: 'abs:"digital workplace" AND (survey OR review)'
    category: survey
    subcategory_hint: review

